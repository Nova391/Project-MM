<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Transactions</title>
    <link rel="stylesheet" href="../Shared/shared.css">
    <link rel="stylesheet" href="../Transactions/transactions.css">
    <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body>

    <!-- SINGLE SIDEBAR CONTAINER -->
    <nav class="sidebar">
        <div class="sidebarHeader">
            <button id="menuButton">☰</button>
            <span class="sidebar-title">Project MM</span>
        </div>

        <a href="/dashboard/dashboard.html">
            <i data-lucide="house"></i>
            <span class="link-text">Home</span>
        </a>
        <a href="/Accounts/accounts.html">
            <i data-lucide="wallet"></i>
            <span class="link-text">Accounts</span>
        </a>
        <a href="/Transactions/transactions.html" class="active">
            <i data-lucide="arrow-left-right"></i>
            <span class="link-text">Transactions</span>
        </a>
        <a href="/About/about.html">
            <i data-lucide="info"></i>
            <span class="link-text">About</span>
        </a>
    </nav>

    <!-- MAIN CONTENT -->
    <main id="maincontent">
        <section>
            <div class="transactionsHeader">
                <h2 id="transactionsTitle">Transactions</h2>
                <button id="AddTransaction">+ New Transaction</button>
            </div>
            <div class="AddTransactionsModal">
                <div class="AddTransactionsForm">
                    <div class="input-group">
                        <label>Transaction Type</label>
                        <div class="type-toggle-container">
                            <input type="radio" id="typeIncome" name="transactionType" value="Income" checked>
                            <label for="typeIncome" class="type-box">Income</label>
                            <input type="radio" id="typeExpense" name="transactionType" value="Expense">
                            <label for="typeExpense" class="type-box">Expense</label>
                        </div>
                    </div>

                    <label for="account">Account</label>
                    <select id="account" name="account" required></select>

                    <label for="amount">Amount</label>
                    <input type="number" id="amount" name="amount" step="0.01" required>


                    <label for="category">Category</label>
                    <select id="category" name="Category" required>
                    </select>

                    <label for="date">Date</label>
                    <input type="date" id="date" name="date" required>

                    <label for="description">Description</label>
                    <input type="text" id="description" name="description" required>

                    <button type="submit" id="submitTransaction">Add Transaction</button>
                    <button type="button" id="closeModal">Cancel</button>
                </div>
            </div>
        </section>
        
        <section>
            <h2>Recent Transactions</h2>
            <table>
                <thead>
                    <tr>
                        <th>Type</th>
                        <th>Description</th>
                        <th>Category</th>
                        <th>Date</th>
                        <th>Account</th>
                        <th>Amount</th>
                    </tr>
                </thead>
                <tbody></tbody>
            </table>
        </section>
    </main>

    <script src="../Shared/shared.js"></script>
    <script src="../Transactions/transactions.js"></script>
    <script>
        lucide.createIcons();
    </script>
</body>
</html>
