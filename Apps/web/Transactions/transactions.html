<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Transactions</title>
    <link rel="stylesheet" href="../Shared/shared.css">
    <link rel="stylesheet" href="../Transactions/transactions.css">
    <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body>

    <nav class="sidebar">
        <div class="sidebarHeader">
            <button id="menuButton">☰</button>
            <span class="sidebar-title">Project MM</span>
        </div>

        <a href="../dashboard/dashboard.html">
            <i data-lucide="house"></i>
            <span class="link-text">Dashboard</span>
        </a>
        <a href="../Accounts/accounts.html">
            <i data-lucide="wallet"></i>
            <span class="link-text">Accounts</span>
        </a>
        <a href="../Transactions/transactions.html" class="active">
            <i data-lucide="arrow-left-right"></i>
            <span class="link-text">Transactions</span>
        </a>
        <a href="../About/about.html">
            <i data-lucide="info"></i>
            <span class="link-text">About</span>
        </a>
    </nav>

    <main id="maincontent">
        <section>
            <div class="transactionsHeader">
                <h2 id="transactionsTitle">Transactions</h2>
                <button id="AddTransaction">+ New Transaction</button>
            </div>
            <div class="AddTransactionsModal">
                <form class="AddTransactionsForm">
                    <div class="input-group">
                        <label>Transaction Type</label>
                        <div class="type-toggle-container">
                            <input type="radio" id="typeIncome" name="transactionType" value="Income" checked>
                            <label for="typeIncome" class="type-box">Income</label>
                            <input type="radio" id="typeExpense" name="transactionType" value="Expense">
                            <label for="typeExpense" class="type-box">Expense</label>
                        </div>
                    </div>

                    <label for="account">Account</label>
                    <select id="account" name="account" required></select>
                    
                    <label for="amount">Amount</label>
                    <div class="amountThings">
                        <input type="number" id="amount" name="amount" step="0.01" required>
                        <span id="TransactionCurrency"></span>
                    </div>

                    <div class="CategoryContainer">
                        <label for="category">Category</label>
                        <button type="button" id="AddCategory">+</button>
                    </div>
                    <select id="category" name="Category" required>
                    </select>

                    <label for="date">Date</label>
                    <input type="date" id="date" name="date" required>

                    <label for="description">Description</label>
                    <input type="text" id="description" name="description" required>

                    <button type="button" id="submitTransaction">Add Transaction</button>
                    <button type="button" id="closeModal">Cancel</button>
                </form>
                <div class="CategoryModal">
                    <form class="CategoryForm">
                        <h2>Add Category</h2>

                        <label for="CategoryName">Category Name</label>
                        <input type="text" id="CategoryName">

                        <div class="CategoryButtons">
                            <button type="button" id="CancelAddCategory">Cancel</button>
                            <button type="button" id="submitCategory">Save</button>
                        </div>
                    </form>
                </div>
            </div>
        </section>
        
        <section>
            <div class="transactionFilters">
                <input type="text" id="transactionsSearch" placeholder="Search transactions...">

                <select id="accountFilter">
                    <option value="">All Accounts</option>
                </select>

                <select id="typeFilter">
                    <option value="">All Types</option>
                    <option value="Income">Income</option>
                    <option value="Expense">Expense</option>
                </select>

                <select id="categoryFilter">
                    <option value="">All Categories</option>
                </select>
            </div>
            <table>
                <thead>
                    <tr>
                        <th>Account</th>
                        <th>Type</th>
                        <th>Description</th>
                        <th>Category</th>
                        <th>Date</th>
                        <th>Amount</th>
                    </tr>
                </thead>
                <tbody id="transactionsBody"></tbody>
            </table>
            <div class="DetailsModal">
                <form class="DetailsForm">
                    <h2>Transaction Details</h2>
                    <div class="detail-row">
                        <span>Transaction Type</span>
                        <strong id="typeDetail"></strong>
                    </div>

                    <div class="detail-row">
                        <span>Account</span>
                        <strong id="accountDetail"></strong>
                    </div>

                    <div class="detail-row">
                        <span>Amount</span>
                        <strong id="amountDetail"></strong>
                        <span id="DetailCurrency"></span>
                    </div>

                    <div class="detail-row">
                        <span>Category</span>
                        <strong id="categoryDetail"></strong>
                    </div>

                    <div class="detail-row">
                        <span>Date</span>
                        <strong id="dateDetail"></strong>
                    </div>

                    <div class="detail-row">
                        <span>Description</span>
                        <strong id="descriptionDetail"></strong>
                    </div>

                    <div class="DetailButtons">
                        <button type="button" id="closeDetails">Close</button>
                        <button type="button" id="DeleteTransaction">Delete Transaction</button>
                    </div>
                    <div class="DeleteModal">
                        <div class="DeleteForm">
                            <span>Are you sure you want to delete this transaction?</span>
                            <span>This action cannot be undone.</span>
                            <div class="deleteButtons">
                                <button id="CancelDelete">Cancel</button>
                                <button id="Delete">Delete</button>
                            </div>
                        </div>
                    </div>
                </form>
            </div>
        </section>
    </main>

    <script src="../Shared/shared.js"></script>
    <script src="../Transactions/transactions.js"></script>
    <script>
        lucide.createIcons();
    </script>
</body>
</html>
